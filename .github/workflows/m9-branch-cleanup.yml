name: Remove the merged M9 branch
on:
  push:
    branches: [v2]
    paths: [.github/workflows/m9-branch-cleanup.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  remove-merged-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify the merge and unchanged branch, then remove only v2-m9-release
        env:
          M9_CLEANUP_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          root = "https://api.github.com/repos/rolandmraiha-cmd/roland-agent"
          read_path = "/git/ref/heads/v2-m9-release"
          delete_path = "/git/refs/heads/v2-m9-release"
          headers = {
              "Authorization": "Bearer " + os.environ["M9_CLEANUP_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, method="GET"):
              request = urllib.request.Request(root + path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read()) if response.status != 204 else None

          pr = api("/pulls/64")
          assert pr["merged"] and pr["base"]["ref"] == "v2", "M9 is not merged into v2"
          assert pr["merge_commit_sha"] == "720c58cfe4c7d0595f9f6af0c21e321f5b8534e8", "Unexpected merge"
          ref = api(read_path)
          assert ref["object"]["sha"] == "afee233aafda31cb4e3fa342fe7f121b2160a15e", "Branch changed; refusing deletion"
          api(delete_path, "DELETE")
          try:
              api(read_path)
          except urllib.error.HTTPError as error:
              assert error.code == 404, "Could not verify branch deletion"
          else:
              raise SystemExit("Branch still exists")
          print("PASS: merged v2-m9-release removed; v2/main retained")
          PY
