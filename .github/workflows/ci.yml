name: CI

on:
  pull_request:
  push:
    branches:
      - v2
      - "v2-*"
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - run: make lint

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - uses: actions/setup-node@1e60f620b9541d7c2439c8f7a8cea4a018f13b9b # v4.0.3
        with:
          node-version: "20"
      - run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - run: make test
