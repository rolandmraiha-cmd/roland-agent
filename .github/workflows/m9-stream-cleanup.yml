name: Remove the merged M9 streaming-fix branch
on:
  push:
    branches: [v2]
    paths: [.github/workflows/m9-stream-cleanup.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  remove-merged-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify PR70 and the unchanged branch, then remove only v2-m9-stream-downloads
        env:
          M9_STREAM_CLEANUP_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          root = "https://api.github.com/repos/rolandmraiha-cmd/roland-agent"
          read_path = "/git/ref/heads/v2-m9-stream-downloads"
          headers = {
              "Authorization": "Bearer " + os.environ["M9_STREAM_CLEANUP_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, method="GET"):
              request = urllib.request.Request(root + path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read()) if response.status != 204 else None

          pr = api("/pulls/70")
          assert pr["merged"] and pr["base"]["ref"] == "v2", "PR70 is not merged into v2"
          assert pr["merge_commit_sha"] == "226ee63f536bd6d809c712d498f92bc8b3c99216", "Unexpected merge"
          assert pr["head"]["ref"] == "v2-m9-stream-downloads", "Unexpected branch"
          assert pr["head"]["sha"] == "01a454987631060668a968fc5ec12050ec2ee163", "Unexpected PR head"
          ref = api(read_path)
          assert ref["object"]["sha"] == pr["head"]["sha"], "Branch changed; refusing deletion"
          api("/git/refs/heads/v2-m9-stream-downloads", "DELETE")
          try:
              api(read_path)
          except urllib.error.HTTPError as error:
              assert error.code == 404, "Could not verify branch deletion"
          else:
              raise SystemExit("Branch still exists")
          print("PASS: merged v2-m9-stream-downloads removed")
          PY
