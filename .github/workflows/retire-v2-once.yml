name: Retire merged v2 once

on:
  push:
    branches: [v2-retire-integration]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: retire-merged-v2-shipping-fix
  cancel-in-progress: false

jobs:
  retire:
    if: github.repository == 'rolandmraiha-cmd/roland-agent' && github.ref == 'refs/heads/v2-retire-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Wait for the reviewed main PR, then delete only unchanged merged refs
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time

          repository = "rolandmraiha-cmd/roland-agent"
          feature = "v2-retire-integration"
          old_v2 = "76ad775d16d7113c4292648ae2b9681779ecc5f9"
          allowed = {
              ".github/workflows/ci.yml", ".github/workflows/training.yml",
              "README.md", "docs/AGENT.md", "docs/NEXT.md", "docs/RUNBOOK.md",
              "deploy/ship.sh", "tests/test_deploy_scripts.py",
          }

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def api(path):
              endpoint = f"repos/{repository}" + (f"/{path}" if path else "")
              return json.loads(command("gh", "api", endpoint))

          if api("")["default_branch"] != "main":
              raise SystemExit("STOP: main is not the default branch")

          deadline = time.monotonic() + 25 * 60
          while True:
              rows = api(f"pulls?state=all&base=main&head=rolandmraiha-cmd%3A{feature}&per_page=100")
              if len(rows) > 1:
                  raise SystemExit("STOP: ambiguous cleanup PR")
              if rows:
                  pr = api(f"pulls/{rows[0]['number']}")
                  if pr["state"] == "closed" and not pr["merged"]:
                      raise SystemExit("STOP: cleanup PR closed without merge")
                  if pr["merged"]:
                      break
              if time.monotonic() >= deadline:
                  raise SystemExit("STOP: reviewed merge did not complete in time")
              print("Waiting for the reviewed cleanup PR to merge into main", flush=True)
              time.sleep(30)

          if (pr["base"]["ref"] != "main" or pr["head"]["ref"] != feature
                  or pr["head"]["repo"]["full_name"] != repository):
              raise SystemExit("STOP: unexpected merged PR")
          files = api(f"pulls/{pr['number']}/files?per_page=100")
          if pr["changed_files"] != len(files) or {f["filename"] for f in files} != allowed:
              raise SystemExit("STOP: unexpected cleanup changes")

          command("git", "fetch", "origin", "refs/heads/main:refs/remotes/origin/main")
          main = command("git", "rev-parse", "origin/main")
          for commit in (old_v2, pr["head"]["sha"], pr["merge_commit_sha"]):
              subprocess.run(["git", "merge-base", "--is-ancestor", commit, main], check=True)
          workflow = ".github/workflows/retire-v2-once.yml"
          if subprocess.run(["git", "cat-file", "-e", f"{pr['head']['sha']}:{workflow}"],
                            stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              raise SystemExit("STOP: one-use workflow is still in the final source tree")
          open_prs = api("pulls?state=open&per_page=100")
          if len(open_prs) == 100 or any(p["base"]["ref"] == "v2" or
                                      p["head"]["ref"] == "v2" for p in open_prs):
              raise SystemExit("STOP: open PR may depend on v2")

          for branch, expected in (("v2", old_v2), (feature, pr["head"]["sha"])):
              ref = f"refs/heads/{branch}"
              found = command("git", "ls-remote", "--heads", "origin", ref)
              if not found:
                  print(f"Already absent: {branch}", flush=True)
                  continue
              if found.split()[0] != expected:
                  raise SystemExit(f"STOP: {branch} moved from its merged head")
              subprocess.run(["git", "push", f"--force-with-lease={ref}:{expected}",
                              "origin", f":{ref}"], check=True)
              if command("git", "ls-remote", "--heads", "origin", ref):
                  raise SystemExit(f"STOP: {branch} remains after deletion")
              print(f"Deleted unchanged merged branch: {branch}", flush=True)
          print("PASS: v2 retired; merged cleanup branch removed; main retained", flush=True)
          PY
