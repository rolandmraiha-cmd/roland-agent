# Test overrides (§13.3). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d sandbox
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm tester
# The browser stack has its own script, which also restarts the browser half way through:
#   make test-browser        (tests/integration/browser.sh)
name: roland-agent-test

services:
  caddy:
    profiles: ["edge-test"]

  core:
    profiles: ["full-stack"]

  model:
    profiles: ["with-model"]
    environment:
      MODEL_CTX: "2048"
    mem_limit: ${MODEL_MEM_LIMIT:-1g}
    memswap_limit: ${MODEL_MEM_LIMIT:-1g}

  sandbox:
    volumes:
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-./.ci-workspace}
        target: /workspace
        bind: { create_host_path: true }
    environment:
      SANDBOXD_ALLOWED_PEERS: "10.77.3.10,127.0.0.1"

  # The real browser service, pointed at the fixture site. The site has a private address,
  # so its name is let through here and nowhere else (never in docker-compose.yml).
  browser:
    environment:
      BROWSER_ALLOW_PRIVATE_HOSTS: fixture-web
    volumes:
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-./.ci-workspace}/browser
        target: /files
        bind: { create_host_path: true }
    networks:
      fixtures: { ipv4_address: 10.77.20.40 }

  fixture-web:
    build: { context: ., dockerfile: Dockerfile }
    image: roland-agent/core:local
    user: "1000:1000"
    working_dir: /app
    environment:
      HOST: 10.77.20.20
      PORT: "8080"
    volumes:
      - type: bind
        source: ./tests/fixtures/site
        target: /app/tests/fixtures/site
        read_only: true
        bind: { create_host_path: false }
    command: ["python", "tests/fixtures/site/server.py"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks:
      fixtures: { ipv4_address: 10.77.20.20 }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client; c = http.client.HTTPConnection('10.77.20.20', 8080, timeout=2); c.request('GET', '/_log'); r = c.getresponse(); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64

  # Runs the integration tests with core's code in-process, at core's addresses on the
  # control networks, so sandboxd and browserd see the peer they expect.
  tester:
    build: { context: ., dockerfile: docker/tester/Dockerfile }
    image: roland-agent/tester:local
    user: "1000:1000"
    working_dir: /src
    environment:
      AGENT_ENV: development
      COOKIE_SECURE: "false"
      HOST: 127.0.0.1
      PORT: "8080"
      DATA_DIR: /tmp/data
      WORKSPACE_DIR: /workspace
      ALLOW_SHELL: "true"
      SHELL_BACKEND: sandbox
      SANDBOX_URL: http://10.77.3.20:7000
      SANDBOX_API_TOKEN_FILE: /run/secrets/sandbox_api_token
      BROWSER_ENABLED: "false"
      BROWSER_URL: http://10.77.4.40:7100
      BROWSER_API_TOKEN_FILE: /run/secrets/browser_api_token
      FIXTURE_URL: http://fixture-web:8080
      BROWSER_LIVE_REQUIRED: ${BROWSER_LIVE_REQUIRED:-}
      BROWSER_LIVE_AFTER_RESTART: ${BROWSER_LIVE_AFTER_RESTART:-}
      SCREEN_ENABLED: "false"
      TZ: Europe/Helsinki
    secrets: [sandbox_api_token, browser_api_token]
    volumes:
      - type: bind
        source: .
        target: /src
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-./.ci-workspace}
        target: /workspace
        bind: { create_host_path: true }
    tmpfs: ["/tmp:size=256m,mode=1777"]
    networks:
      sandbox_ctl: { ipv4_address: 10.77.3.10 }
      browser_ctl: { ipv4_address: 10.77.4.10 }
      fixtures: { ipv4_address: 10.77.20.10 }
    depends_on:
      sandbox: { condition: service_healthy }
      fixture-web: { condition: service_healthy }
    # The image already holds pytest and core's dependencies (docker/tester/Dockerfile).
    command: ["python", "-m", "pytest", "-m", "integration", "-q", "-p", "no:cacheprovider", "tests/integration"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128

networks:
  fixtures:
    internal: true
    enable_ipv6: false
    ipam:
      config: [{ subnet: 10.77.20.0/24 }]
