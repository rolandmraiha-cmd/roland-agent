[project]
name = "roland-agent"
version = "0.1.0"
description = "Roland's own always-on AI agent: web chat, memory, tools and background jobs with a local model."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "croniter>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml==6.0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.web", "agent.models", "agent.migrations"]

[tool.setuptools.package-data]
"agent.web" = ["static/*"]
"agent.models" = ["*.gbnf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"agent/local_shell.py" = ["S602", "S604"]
