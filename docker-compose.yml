name: roland-agent

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

x-host: &agent_host ${AGENT_DOMAIN:-${AGENT_FALLBACK_HOST:-37-60-226-214.sslip.io}}

# M4: core + caddy + model + sandbox. M6 adds the browser service, behind the "browser"
# profile: it only starts when .env has COMPOSE_PROFILES=browser, and core only uses it when
# .env also has BROWSER_ENABLED=true. Screen and training stay off.
services:
  caddy:
    <<: *hardening
    build: { context: ., dockerfile: docker/caddy/Dockerfile }
    image: roland-agent/caddy:local
    user: "1000:1000"
    sysctls: { net.ipv4.ip_unprivileged_port_start: "0" }
    ports: ["80:80/tcp", "443:443/tcp", "443:443/udp"]
    environment:
      AGENT_HOST: *agent_host
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_TLS: ${CADDY_TLS:-acme}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
    volumes: [caddy-data:/data, caddy-config:/config]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks:
      public: { ipv4_address: 10.77.0.2, gw_priority: 100 }
      edge: { ipv4_address: 10.77.1.2 }
      screen: { ipv4_address: 10.77.2.2 }
    depends_on: { core: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    pids_limit: 64

  core:
    <<: *hardening
    build: { context: ., dockerfile: Dockerfile }
    image: roland-agent/core:local
    user: "1000:1000"
    env_file: .env
    environment:
      AGENT_ENV: production
      AGENT_HOST: *agent_host
      ALLOWED_HOSTS: *agent_host
      COOKIE_SECURE: "true"
      HOST: 10.77.1.10
      PORT: "8080"
      FORWARDED_ALLOW_IPS: 10.77.1.2
      CORE_ALLOWED_PEERS: 10.77.1.2
      DATA_DIR: /data
      WORKSPACE_DIR: /workspace
      BACKUP_DIR: /backups
      ALLOW_SHELL: "true"
      SHELL_BACKEND: sandbox
      SANDBOX_URL: http://10.77.3.20:7000
      SANDBOX_API_TOKEN_FILE: /run/secrets/sandbox_api_token
      BROWSER_ENABLED: ${BROWSER_ENABLED:-false}
      BROWSER_URL: http://10.77.4.40:7100
      BROWSER_API_TOKEN_FILE: /run/secrets/browser_api_token
      SCREEN_ENABLED: "false"
      TRAINING_CAPTURE: "false"
      TRAINING_LOOP_ENABLED: "false"
      TRAINER_URL: ""
      MODEL_PROVIDER: ${MODEL_PROVIDER:-llamacpp}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://10.77.6.60:8080}
      MODEL_MAX_CONCURRENCY: "1"
      MODEL_SERVER_TOKEN_FILE: /run/secrets/model_server_token
      AGENT_PASSWORD_HASH_FILE: /run/secrets/agent_password_hash
    secrets: [model_server_token, agent_password_hash, sandbox_api_token, browser_api_token]
    volumes:
      - agent-data:/data
      - backups:/backups
      - models:/models:ro
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-/srv/roland-agent/workspace}
        target: /workspace
        bind: { create_host_path: false }
    tmpfs: ["/tmp:size=96m,mode=1777"]
    networks:
      edge: { ipv4_address: 10.77.1.10 }
      sandbox_ctl: { ipv4_address: 10.77.3.10 }
      # Core only calls out on this network. It listens on its edge address alone, so the
      # browser container finds nothing to connect to here.
      browser_ctl: { ipv4_address: 10.77.4.10 }
      model: { ipv4_address: 10.77.6.10 }
      core_egress: { gw_priority: 100 }
    healthcheck:
      test: ["CMD", "python", "-m", "agent", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      model: { condition: service_started }
      sandbox: { condition: service_healthy }

  model:
    <<: *hardening
    # Verified multi-platform CPU image; keep in sync with docker/model/VERSION.
    image: ghcr.io/ggml-org/llama.cpp:server-b11434@sha256:af8c29600d1de84945de13fa7f126d06fdae16c4b19dc7db1c69c74287eae257
    user: "1000:1000"
    entrypoint: ["bash", "/opt/run/run.sh"]
    environment:
      MODEL_CTX: ${MODEL_CTX:-4096}
      MODEL_THREADS: ${MODEL_THREADS:-3}
      MODEL_SERVER_TOKEN_FILE: /run/secrets/model_server_token
    secrets: [model_server_token]
    volumes:
      - models:/models:ro
      - type: bind
        source: ./docker/model/run.sh
        target: /opt/run/run.sh
        read_only: true
        bind: { create_host_path: false }
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks:
      model: { ipv4_address: 10.77.6.60 }
    healthcheck:
      test: ["CMD", "bash", "/opt/run/run.sh", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    oom_score_adj: 300
    mem_limit: ${MODEL_MEM_LIMIT:-3840m}
    memswap_limit: ${MODEL_MEM_LIMIT:-3840m}
    cpus: ${MODEL_CPUS:-3.0}
    pids_limit: 128


  sandbox:
    <<: *hardening
    build: { context: ., dockerfile: docker/sandbox/Dockerfile }
    image: roland-agent/sandbox:local
    user: "1000:1000"
    environment:
      SANDBOXD_HOST: 10.77.3.20
      SANDBOXD_PORT: "7000"
      SANDBOXD_ALLOWED_PEERS: 10.77.3.10
      SANDBOX_API_TOKEN_FILE: /run/secrets/sandbox_api_token
      SANDBOX_MAX_OUTPUT_BYTES: "65536"
      SANDBOX_MAX_CONCURRENT: "2"
      SANDBOX_TIMEOUT_MAX: "300"
      TZ: Europe/Helsinki
    secrets: [sandbox_api_token]
    volumes:
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-/srv/roland-agent/workspace}
        target: /workspace
        bind: { create_host_path: false }
    tmpfs: ["/tmp:size=384m,mode=1777"]
    networks:
      sandbox_ctl: { ipv4_address: 10.77.3.20 }
      sandbox_egress: { ipv4_address: 10.77.11.20, gw_priority: 100 }
    healthcheck:
      test: ["CMD", "python", "-m", "sandboxd", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ulimits: { nofile: { soft: 1024, hard: 1024 } }
    oom_score_adj: 800
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 256

  # One persistent Chromium on a virtual screen, driven by browserd (§6.5). Off unless the
  # "browser" profile is on. The profile volume holds Roland's signed-in sessions and is
  # mounted here and nowhere else.
  browser:
    <<: *hardening
    profiles: ["browser"]
    security_opt:
      - no-new-privileges:true
      # Docker's own seccomp profile, unless .env sets BROWSER_SECCOMP to
      # ./docker/browser/seccomp-chromium.json. Chromium's own sandbox
      # (BROWSER_CHROMIUM_SANDBOX=true) needs that one. See docs/SECURITY.md.
      - seccomp=${BROWSER_SECCOMP:-builtin}
    build: { context: ., dockerfile: docker/browser/Dockerfile }
    image: roland-agent/browser:local
    user: "1000:1000"
    environment:
      BROWSERD_HOST: 10.77.4.40
      BROWSERD_PORT: "7100"
      BROWSERD_ALLOWED_PEERS: 10.77.4.10
      DISPLAY: ":99"
      HOME: /tmp/home
      TZ: Europe/Helsinki
      BROWSER_VIEWPORT: ${BROWSER_VIEWPORT:-1280x800}
      BROWSER_MAX_TABS: ${BROWSER_MAX_TABS:-2}
      BROWSER_CHROMIUM_SANDBOX: ${BROWSER_CHROMIUM_SANDBOX:-false}
      BROWSER_SENSITIVE_MATCH: ${BROWSER_SENSITIVE_MATCH:-word}
      BROWSER_BLOCK_BACKGROUND_POSTS: ${BROWSER_BLOCK_BACKGROUND_POSTS:-false}
      BROWSER_API_TOKEN_FILE: /run/secrets/browser_api_token
    secrets: [browser_api_token]
    volumes:
      - browser-profile:/profile
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-/srv/roland-agent/workspace}/browser
        target: /files
        bind: { create_host_path: false }
    tmpfs: ["/tmp:size=256m,mode=1777"]
    shm_size: 320m
    networks:
      browser_ctl: { ipv4_address: 10.77.4.40 }
      browser_egress: { ipv4_address: 10.77.12.40, gw_priority: 100 }
    healthcheck:
      test: ["CMD", "python", "-m", "browserd", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Long enough for Chromium to write cookies to the profile before it is stopped.
    stop_grace_period: 30s
    oom_score_adj: 500
    # The cap includes /dev/shm and /tmp, which are memory too.
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 2.0
    pids_limit: 512

# Reserved bridges are declared now; later services attach when implemented.
networks:
  public:         { enable_ipv6: false, ipam: { config: [{ subnet: 10.77.0.0/24 }] } }
  edge:           { internal: true, enable_ipv6: false, ipam: { config: [{ subnet: 10.77.1.0/24 }] } }
  screen:         { internal: true, enable_ipv6: false, ipam: { config: [{ subnet: 10.77.2.0/24 }] } }
  sandbox_ctl:    { internal: true, enable_ipv6: false, ipam: { config: [{ subnet: 10.77.3.0/24 }] } }
  browser_ctl:    { internal: true, enable_ipv6: false, ipam: { config: [{ subnet: 10.77.4.0/24 }] } }
  vnc:            { internal: true, enable_ipv6: false, ipam: { config: [{ subnet: 10.77.5.0/24 }] } }
  model:          { internal: true, enable_ipv6: false, ipam: { config: [{ subnet: 10.77.6.0/24 }] } }
  trainer_ctl:    { internal: true, enable_ipv6: false, ipam: { config: [{ subnet: 10.77.7.0/24 }] } }
  core_egress:    { enable_ipv6: false, ipam: { config: [{ subnet: 10.77.10.0/24 }] } }
  sandbox_egress: { enable_ipv6: false, ipam: { config: [{ subnet: 10.77.11.0/24 }] } }
  browser_egress: { enable_ipv6: false, ipam: { config: [{ subnet: 10.77.12.0/24 }] } }
  trainer_egress: { enable_ipv6: false, ipam: { config: [{ subnet: 10.77.13.0/24 }] } }

volumes:
  agent-data:
  backups:
  browser-profile:
  caddy-data:
  caddy-config:
  models:

secrets:
  model_server_token: { file: ./secrets/model_server_token }
  agent_password_hash: { file: ./secrets/agent_password_hash }
  sandbox_api_token: { file: ./secrets/sandbox_api_token }
  browser_api_token: { file: ./secrets/browser_api_token }
